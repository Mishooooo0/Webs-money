name: CI

# Every branch: the hub and the templates alike. Client branches live in the
# private web-clients repo and run their own copy of this.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-hub verifies the branches the catalogue names
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step — these checks are deliberately dependency-free.
      #
      # Branch on the shape of the checkout, not on the branch name, so a
      # renamed branch cannot skip its checks.
      #
      # hub/catalogue.js is the discriminator on its own. main carries the
      # website AND the catalogue; a template branch carries a site but never
      # a hub/ directory — check-hub.js §2 fails the build if one ever does.
      # Testing for index.html as well used to work only because main had no
      # index.html of its own; it has one now, and that test would have sent
      # main into the template arm and run six checks written for pages it
      # does not have.
      - name: Run the checks for this branch's shape
        run: |
          if [ -f hub/catalogue.js ]; then
            echo "website branch — running check-hub"
            node tools/check-hub.js
          else
            echo "template branch — running the six static checks"
            node tools/check.js
          fi

  audit:
    name: Browser audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Any branch with pages at its root gets audited — that now includes
      # main, whose website is exactly the kind of thing these checks are
      # for: console errors, horizontal overflow and AA contrast in both
      # languages.
      - id: shape
        run: |
          if [ -f index.html ]; then echo "site=true" >> "$GITHUB_OUTPUT";
          else echo "site=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.shape.outputs.site == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.shape.outputs.site == 'true'
        run: npx playwright install --with-deps chromium
      # Console errors, horizontal overflow, WCAG AA contrast in both
      # languages, and brand SVGs that fail to load behind a CSS mask.
      - if: steps.shape.outputs.site == 'true'
        run: node tools/audit.js
      - if: steps.shape.outputs.site != 'true'
        run: echo "No pages at the root — nothing to audit."
