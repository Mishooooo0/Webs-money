<!DOCTYPE html>
<!--
  TEMPLATES — what is actually inside each one.

  Every section renders from hub/catalogue.js: the page list, what the
  template holds, the names, the accent. None of it is written here, so
  none of it can quietly disagree with the branch it describes —
  tools/check-hub.js §2b compares both against the branch on every push
  and fails the build when they drift apart.

  That is also why the <noscript> block below stays deliberately thin. It
  names the three templates and links their demos, and nothing more: it is
  hand-written, so anything richer would be a second copy of the
  catalogue with no check behind it.
-->
