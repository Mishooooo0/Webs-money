<!--
  SERVICES · the badge lockup — ★ RESKIN FILE 3a
  The sparkle inside a ring, over a drawn STUDIO wordmark.

  Letterforms are drawn as stroked paths rather than set as <text>: this
  file is loaded through a CSS mask, where webfonts are unavailable and
  system fonts differ per platform, so type would render inconsistently.

  Replace with the client's real logo. Keep the viewBox square and the
  artwork a flat silhouette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logo">
  <circle cx="60" cy="60" r="55" fill="none" stroke="#000" stroke-width="2.4"/>

  <g fill="#000" transform="translate(60 48) scale(0.86) translate(-24 -24)">
    <path d="M24 2 C26 15 33 22 46 24 C33 26 26 33 24 46 C22 33 15 26 2 24 C15 22 22 15 24 2 Z"/>
  </g>

  <line x1="46" y1="70" x2="74" y2="70" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>

  <!-- S T U D I O -->
  <g fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
