<!--
  RAHWAH · the badge lockup — ★ RESKIN FILE 3a
  The circular badge: the sprig mark over a drawn RAHWAH wordmark.

  Letterforms are drawn as stroked paths rather than <text> on purpose —
  this file is loaded through a CSS mask, where webfonts are unavailable
  and system fonts differ per platform, so type would render inconsistently.
  Paths render identically everywhere.

  The Arabic رهوة is NOT drawn here: it renders as live HTML text in the
  header and footer wordmark (SITE.brand.primary), where it stays crisp at
  any size and remains selectable and translatable.

  Drop the café's real logo in as this file when it arrives — keep the
  viewBox square and the artwork a flat silhouette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Rahwah">

  <circle cx="60" cy="60" r="55" fill="none" stroke="#000" stroke-width="2.4"/>

  <!-- sprig mark, from mark.svg -->
  <g fill="#000" transform="translate(60 49) scale(0.72) translate(-24 -24)">
    <circle cx="14" cy="13" r="2.9"/>
    <circle cx="24" cy="8.5" r="2.9"/>
    <circle cx="34" cy="13" r="2.9"/>
    <path d="M24 18.5 L31.2 33 L16.8 33 Z"/>
    <path d="M13.2 24 L19.4 39 L7 39 Z"/>
    <path d="M34.8 24 L41 39 L28.6 39 Z"/>
  </g>

  <line x1="45" y1="69" x2="75" y2="69" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>

  <!-- R A H W A H — wide-tracked, matching the shopfront lettering -->
  <g fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- R -->
    <path d="M26.5 90 L26.5 79 L31 79 A2.75 2.75 0 0 1 31 84.5 L26.5 84.5"/>
    <path d="M29.5 84.5 L33.5 90"/>
    <!-- A -->
    <path d="M38.5 90 L42 79 L45.5 90"/>
    <path d="M40.1 85.5 L43.9 85.5"/>
    <!-- H -->
    <path d="M50.5 79 L50.5 90"/>
    <path d="M57.5 79 L57.5 90"/>
    <path d="M50.5 84.5 L57.5 84.5"/>
    <!-- W -->
    <path d="M61.8 79 L63.6 90 L66 82.5 L68.4 90 L70.2 79"/>
    <!-- A -->
    <path d="M74.5 90 L78 79 L81.5 90"/>
    <path d="M76.1 85.5 L79.9 85.5"/>
    <!-- H -->
    <path d="M86.5 79 L86.5 90"/>
    <path d="M93.5 79 L93.5 90"/>
    <path d="M86.5 84.5 L93.5 84.5"/>
  </g>
</svg>
