<!--
  RETAIL · the badge lockup — ★ RESKIN FILE 3a
  The facet mark inside a ring, over a drawn MAISON wordmark.

  Letterforms are drawn as stroked paths rather than set as <text>: this
  file is loaded through a CSS mask, where webfonts are unavailable and
  system fonts differ per platform, so type would render inconsistently.

  Replace with the client's real logo. Keep the viewBox square and the
  artwork a flat silhouette.
-->
