    <path d="M6 20 L42 20"/>
    <path d="M24 4 L16 20 L24 44"/>
    <path d="M24 4 L32 20 L24 44"/>
  </g>

  <line x1="46" y1="72" x2="74" y2="72" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>

  <!-- M A I S O N -->
