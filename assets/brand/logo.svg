<!--
  THE BASE · ★ RESKIN FILE 3a — the primary lockup.

  Deliberately abstract. main is the base every template inherits, so its
  logo must not belong to any one vertical: a ring, the leaf mark from
  mark.svg, and a rule. Each template branch replaces it.

  Rendered through a CSS mask, so only the SILHOUETTE matters: solid fill =
  visible, transparent = hidden. Colour comes from tokens.css.
  Keep the viewBox square — the hero badge and every .ph slot assume it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logo">
  <circle cx="60" cy="60" r="55" fill="none" stroke="#000" stroke-width="2.4"/>

  <!-- the leaf from mark.svg, scaled into the badge -->
  <path d="M24 3 C35 15 35 33 24 45 C13 33 13 15 24 3 Z" fill="#000"
        transform="translate(60 48) scale(0.86) translate(-24 -24)"/>

  <line x1="44" y1="78" x2="76" y2="78" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- three dots: a placeholder wordmark, replaced per template -->
  <g fill="#000">
    <circle cx="52" cy="90" r="2.6"/>
    <circle cx="60" cy="90" r="2.6"/>
    <circle cx="68" cy="90" r="2.6"/>
  </g>
</svg>
