<!--
  RETAIL · the divider rule — ★ RESKIN FILE 3d
  Small diamonds strung on a hairline. The lightest of the three dividers.

  Seamless on the x-axis: the diamonds sit clear of both edges and the rule
  runs the full width, so the repeat is invisible.
-->
