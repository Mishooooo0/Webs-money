<!--
  RAHWAH · the Sadu weave band — ★ RESKIN FILE 3d
  The woven divider, after the red-and-white Sadu cushion in the café:
  two rules enclosing alternating diamonds and triangles.

  Seamless on the x-axis — the triangles sitting on x=0 and x=32 are each
  half a motif, so they complete one another when the tile repeats.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 20" width="32" height="20">
  <g fill="#000">
    <rect x="0" y="0" width="32" height="1.8"/>
    <rect x="0" y="18.2" width="32" height="1.8"/>

    <!-- diamonds -->
    <path d="M8 5 L12 10 L8 15 L4 10 Z"/>
    <path d="M24 5 L28 10 L24 15 L20 10 Z"/>

    <!-- triangles, including the two split across the tile edge -->
    <path d="M16 6.5 L19.4 13.5 L12.6 13.5 Z"/>
    <path d="M0 6.5 L3.4 13.5 L-3.4 13.5 Z"/>
    <path d="M32 6.5 L35.4 13.5 L28.6 13.5 Z"/>
  </g>
</svg>
