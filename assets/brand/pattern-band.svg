<!--
  SERVICES · the divider rule — ★ RESKIN FILE 3d
  A fine dash-and-dot rule. Deliberately quieter than the café template's
  woven band.

  Seamless on the x-axis: the dashes sit clear of both edges and the
  spacing either side is equal, so the repeat is invisible.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 12" width="32" height="12">
  <g fill="#000">
    <rect x="0" y="5" width="12" height="1.6" rx="0.8"/>
    <circle cx="20" cy="5.8" r="1.9"/>
    <rect x="26" y="5" width="6" height="1.6" rx="0.8"/>
  </g>
</svg>
