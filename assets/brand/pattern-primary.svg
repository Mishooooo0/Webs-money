  <g fill="#000">
    <path d="M16 10 L21 16 L16 22 L11 16 Z"/>
    <path d="M0 -6 L5 0 L0 6 L-5 0 Z"/>
    <path d="M32 -6 L37 0 L32 6 L27 0 Z"/>
    <path d="M0 26 L5 32 L0 38 L-5 32 Z"/>
    <path d="M32 26 L37 32 L32 38 L27 32 Z"/>
  </g>
</svg>
