<!--
  RAHWAH · the Najdi star lattice — ★ RESKIN FILE 3c
  Taken from the eight-point star floor tile in the café. Built the
  traditional way: two squares, one rotated 45°, sharing a centre.

  Seamless — a full star sits at the tile centre and quarter-stars sit on
  each corner, so the corners rejoin when the tile repeats. Scale is set by
  the pattern-size token in tokens.css, not here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <g fill="none" stroke="#000" stroke-width="1.7">
    <!-- centre star -->
    <rect x="16" y="16" width="28" height="28"/>
    <rect x="16" y="16" width="28" height="28" transform="rotate(45 30 30)"/>

    <!-- corner stars: quartered by the tile edge -->
    <rect x="-14" y="-14" width="28" height="28"/>
    <rect x="-14" y="-14" width="28" height="28" transform="rotate(45 0 0)"/>

    <rect x="46" y="-14" width="28" height="28"/>
    <rect x="46" y="-14" width="28" height="28" transform="rotate(45 60 0)"/>

    <rect x="-14" y="46" width="28" height="28"/>
    <rect x="-14" y="46" width="28" height="28" transform="rotate(45 0 60)"/>

    <rect x="46" y="46" width="28" height="28"/>
    <rect x="46" y="46" width="28" height="28" transform="rotate(45 60 60)"/>
  </g>
</svg>
