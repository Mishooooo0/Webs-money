<!--
  SERVICES · the arc scale — ★ RESKIN FILE 3c
  Overlapping arcs, the way a scale or fan pattern is built. Calmer than a
  lattice, which suits a room people relax in.

  Seamless — arcs are drawn at the tile centre and at all four edge
  midpoints, so each half completes its partner when the tile repeats.
  Scale is set by the pattern-size token in tokens.css, not here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <g fill="none" stroke="#000" stroke-width="1.4">
    <circle cx="20" cy="20" r="13"/>
    <circle cx="0"  cy="0"  r="13"/>
    <circle cx="40" cy="0"  r="13"/>
    <circle cx="0"  cy="40" r="13"/>
    <circle cx="40" cy="40" r="13"/>
  </g>
</svg>
