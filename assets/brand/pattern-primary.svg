<!--
  RETAIL · the diamond mesh — ★ RESKIN FILE 3c
  A fine lattice of solid diamonds, the way a jeweller's box lining or a
  brocade is set. Quieter and smaller in scale than the other two templates'
  patterns, which is what keeps it reading as luxury rather than folk.

  Seamless — the centre diamond sits clear of the edges and the four corner
  diamonds are quartered by them, so they rejoin when the tile repeats.
  Scale is set by the pattern-size token in tokens.css, not here.
-->
